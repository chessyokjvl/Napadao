<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการผู้เช่า - นภาดาวอพาร์ตเมนต์</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* สไตล์ Grid Card สำหรับห้อง */
    .room-card { border-radius: 12px; overflow: hidden; transition: transform 0.2s; border: 1px solid #e0e6ed; background: #fff; }
    .room-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important; border-color: #b0bec5; }
    
    /* สไตล์สีตามชั้น (Floor Colors) */
    .room-header { padding: 10px; text-align: center; border-bottom: 2px solid rgba(0,0,0,0.05); }
    .room-header h4 { margin: 0; font-weight: 800; font-size: 1.5rem; letter-spacing: 1px; }
    
    .bg-floor-pink { background-color: #f8bbd0; color: #1a2a6c; } /* สีชมพู */
    .bg-floor-gray { background-color: #e0e0e0; color: #1a2a6c; } /* สีเทา */
    .bg-floor-white { background-color: #ffffff; color: #1a2a6c; } /* สีขาว */
    
    /* สไตล์ปุ่ม Filter เฟส */
    .btn-filter { border-radius: 20px; padding: 6px 20px; font-weight: bold; border: 2px solid #1a2a6c; color: #1a2a6c; background: transparent; transition: 0.3s; margin-right: 8px; margin-bottom: 10px; }
    .btn-filter.active, .btn-filter:hover { background: #1a2a6c; color: white; }

    /* สไตล์ตารางด้านล่าง */
    .table-compact th, .table-compact td { padding: 0.5rem 0.2rem; font-size: 0.9rem; vertical-align: middle; }
    @media (max-width: 768px) { .table-compact th, .table-compact td { font-size: 0.75rem; } .table-compact .btn { font-size: 0.75rem; padding: 0.3rem 0.5rem; } }
  </style>
</head>
<body>
  <div id="layout-sidebar"></div>
  <div class="main-wrapper">
    <div class="topbar"><div class="d-flex align-items-center"><button class="btn-toggle-menu" onclick="toggleSidebar()"><i class="bi bi-list"></i></button><h4 class="mb-0 text-dark fw-bold" id="pageTitle"></h4></div></div>
    
    <div class="main-content">
      <div id="loadingRoomMsg" class="text-center text-primary my-5"><div class="spinner-border" style="width: 3rem; height: 3rem;"></div><h5 class="mt-3">กำลังโหลดผังห้องพัก...</h5></div>
      
      <div id="contentSection" class="d-none">
        <div class="mb-4 text-center text-md-start" id="phaseFilterArea">
          <button class="btn-filter active" onclick="filterPhase('all', this)"><i class="bi bi-buildings-fill"></i> ดูทั้งหมด</button>
          <button class="btn-filter" onclick="filterPhase('เฟส 1', this)">เฟส 1 (2 ชั้น)</button>
          <button class="btn-filter" onclick="filterPhase('เฟส 2', this)">เฟส 2 (3 ชั้น)</button>
        </div>

        <div id="roomGridArea"></div>

        <hr class="my-5 border-2">

        <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-table"></i> ตารางสรุปข้อมูลผู้เช่า</h5>
        <div class="container-fluid bg-white p-2 p-md-4 rounded shadow-sm">
          <div class="table-responsive" style="max-height: 50vh; overflow-y: auto;">
            <table class="table table-hover table-bordered align-middle text-center table-compact" style="width: 100%;">
              <thead class="table-light sticky-top"><tr><th style="width: 15%;">ห้อง</th><th style="width: 15%;">สถานะ</th><th style="width: 35%;">ผู้เช่า</th><th style="width: 15%;">ค่าเช่า</th><th style="width: 20%;">จัดการ</th></tr></thead>
              <tbody id="roomTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editNameModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header bg-warning text-dark py-2"><h6 class="modal-title mb-0 fw-bold"><i class="bi bi-pencil-square"></i> แก้ไขชื่อผู้เช่า <span id="editRoomName"></span></h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="editForm" onsubmit="submitEditName(event)"><div class="mb-3"><label class="fw-bold text-muted">ชื่อผู้เช่าปัจจุบัน</label><input type="text" class="form-control form-control-lg text-center fw-bold text-primary" id="editTenantName" required></div><input type="hidden" id="editPhase"><input type="hidden" id="editRoom"><button type="submit" class="btn btn-warning w-100 fw-bold" id="btnEditName">บันทึกการแก้ไข</button><div id="editStatus" class="mt-2 text-center fw-bold small"></div></form></div></div></div></div>

  <div class="modal fade" id="checkInModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header bg-success text-white py-2"><h6 class="modal-title mb-0"><i class="bi bi-box-arrow-in-right"></i> ย้ายเข้า <span id="ciRoomName"></span></h6><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body" style="font-size: 0.9rem;"><form id="ciForm" onsubmit="submitCheckIn(event)"><div class="mb-2"><label class="fw-bold">วันที่เข้าพัก</label><input type="date" class="form-control form-control-sm" id="ciDate" required></div><div class="mb-2"><label class="fw-bold">ชื่อผู้เช่า</label><input type="text" class="form-control form-control-sm" id="ciTenant" required></div><div class="row mb-2"><div class="col-6"><label class="fw-bold">เงินประกัน</label><input type="number" class="form-control form-control-sm" id="ciDeposit" required></div><div class="col-6"><label class="fw-bold">ค่าเช่า</label><input type="number" class="form-control form-control-sm" id="ciRent" required></div></div><div class="row mb-3"><div class="col-6"><label class="fw-bold text-info">มิเตอร์น้ำแรกเข้า</label><input type="number" step="0.1" class="form-control form-control-sm" id="ciWater" required></div><div class="col-6"><label class="fw-bold text-warning">มิเตอร์ไฟแรกเข้า</label><input type="number" step="0.1" class="form-control form-control-sm" id="ciElec" required></div></div><input type="hidden" id="ciPhase"> <input type="hidden" id="ciRoom"><button type="submit" class="btn btn-success btn-sm w-100 fw-bold" id="btnCheckIn">บันทึกข้อมูลย้ายเข้า</button><div id="ciStatus" class="mt-2 text-center fw-bold small"></div></form></div></div></div></div>

  <div class="modal fade" id="checkOutModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header bg-danger text-white py-2"><h6 class="modal-title mb-0"><i class="bi bi-box-arrow-left"></i> ย้ายออก <span id="coRoomName"></span></h6><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body" style="font-size: 0.9rem;"><form id="coForm" onsubmit="submitCheckOut(event)"><div class="mb-2"><label class="fw-bold">วันที่ย้ายออก</label><input type="date" class="form-control form-control-sm" id="coDate" required></div><div class="card p-2 bg-light mb-2"><div class="row"><div class="col-6"><label class="text-info" style="font-size:0.75rem;">น้ำก่อน: <span id="lblPrevW">0</span></label><input type="number" step="0.1" class="form-control form-control-sm border-info" id="coCurrWater" oninput="calcRefund()" required placeholder="เลขใหม่"></div><div class="col-6"><label class="text-warning" style="font-size:0.75rem;">ไฟก่อน: <span id="lblPrevE">0</span></label><input type="number" step="0.1" class="form-control form-control-sm border-warning" id="coCurrElec" oninput="calcRefund()" required placeholder="เลขใหม่"></div></div></div><div class="row mb-2"><div class="col-6"><label class="fw-bold text-secondary">ทำความสะอาด</label><input type="number" class="form-control form-control-sm" id="coCleaning" value="300" oninput="calcRefund()"></div><div class="col-6"><label class="fw-bold text-success">เงินประกัน</label><input type="number" class="form-control form-control-sm" id="coDeposit" readonly></div></div><div class="p-2 bg-white border border-danger rounded mb-3 text-center"><label class="fw-bold text-danger mb-0" style="font-size:0.8rem;">ยอดคืนผู้เช่าสุทธิ (บาท)</label><input type="number" class="form-control text-center fw-bold text-danger border-0 bg-transparent p-0" id="coRefund" readonly value="0" style="font-size: 1.5rem;"></div><input type="hidden" id="coPhase"> <input type="hidden" id="coRoom"><input type="hidden" id="coPrevWaterRaw"> <input type="hidden" id="coPrevElecRaw"><button type="submit" class="btn btn-danger btn-sm w-100 fw-bold" id="btnCheckOut">ยืนยันการย้ายออก</button><div id="coStatus" class="mt-2 text-center fw-bold small"></div></form></div></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderLayout('menu-manage', 'จัดการผู้เช่า');
    let rawRoomData = []; let modalCI = null; let modalCO = null; let modalEdit = null;

    // ล็อกผังห้อง (Layout Mapping)
    const buildingLayout = {
      "เฟส 1": [
        { floorName: "ชั้น 2", colorClass: "bg-floor-pink", rooms: ["4", "5", "6", "7"] },
        { floorName: "ชั้น 1", colorClass: "bg-floor-gray", rooms: ["3", "2", "1", "8"] }
      ],
      "เฟส 2": [
        { floorName: "ชั้น 3", colorClass: "bg-floor-white", rooms: ["C1", "C2", "C3", "C4", "C5"] },
        { floorName: "ชั้น 2", colorClass: "bg-floor-gray", rooms: ["B1", "B2", "B3", "B4", "B5"] },
        { floorName: "ชั้น 1", colorClass: "bg-floor-white", rooms: ["A1", "A2", "A3", "A4", "A5"] }
      ]
    };

    async function initManageRooms() {
      document.getElementById('ciDate').valueAsDate = new Date(); document.getElementById('coDate').valueAsDate = new Date();
      try {
        let data = await apiCall('getManageRoomsData');
        rawRoomData = data; 
        renderData('all'); 
        document.getElementById('loadingRoomMsg').classList.add('d-none'); document.getElementById('contentSection').classList.remove('d-none');
      } catch(err) { document.getElementById('loadingRoomMsg').innerHTML = `<div class="alert alert-danger mx-auto mt-3">❌ Error: ${err.message}</div>`; }
    }

    // ฟังก์ชันค้นหาข้อมูลห้องจาก Database
    function getRoomDataObj(targetPhase, targetRoom) {
      for (let i = 0; i < rawRoomData.length; i++) {
        let dbPhase = String(rawRoomData[i][0] || "").replace("เฟส ", "").replace("เฟส", "").trim();
        let queryPhase = targetPhase.replace("เฟส ", "").replace("เฟส", "").trim();
        if (dbPhase === queryPhase && String(rawRoomData[i][1]) === targetRoom) return { data: rawRoomData[i], index: i };
      }
      return null;
    }

    // ฟังก์ชันวาดหน้าจอทั้งหมด
    function renderData(filterPhaseName) {
      let gridArea = document.getElementById('roomGridArea'); let tbody = document.getElementById('roomTableBody');
      gridArea.innerHTML = ''; tbody.innerHTML = '';

      // 1. วาด Grid ตามผังที่ล็อกไว้
      Object.keys(buildingLayout).forEach(phaseKey => {
        if (filterPhaseName !== 'all' && filterPhaseName !== phaseKey) return; // กรองเฟส

        let html = `<div class="mb-4"><h5 class="fw-bold text-primary mb-3"><i class="bi bi-building"></i> อาคาร ${phaseKey}</h5>`;
        
        buildingLayout[phaseKey].forEach(floor => {
          html += `<div class="fw-bold text-secondary small mb-2"><i class="bi bi-layers"></i> ${floor.floorName}</div>`;
          html += `<div class="row g-2 mb-3">`; // สร้างแถวใหม่สำหรับแต่ละชั้น
          
          floor.rooms.forEach(roomNo => {
             let rData = getRoomDataObj(phaseKey, roomNo);
             if (!rData) return; // ข้ามถ้าห้องไม่มีในชีต

             let row = rData.data; let idx = rData.index;
             let tenant = String(row[2]||"").trim(); let rent = row[3]; let status = String(row[6]||"").trim();
             let isVacant = (status === "ว่าง" || status === "" || tenant === "" || tenant === "-");
             
             // ตั้งค่า UI สำหรับ Grid
             let cardIcon = isVacant ? "door-open text-danger" : "door-closed text-success";
             let tNameGrid = isVacant ? `<span class="badge bg-danger mb-2">ห้องว่าง</span><br><small class="text-muted" style="font-size:0.75rem;">พร้อมให้เช่า</small>` : `<span class="badge bg-success mb-2">มีผู้เช่า</span><br><div class="fw-bold text-truncate text-dark" style="font-size:0.85rem;" title="${tenant}">${tenant}</div>`;
             let gridAction = isVacant 
                ? `<button class="btn btn-sm btn-outline-success w-100 fw-bold mt-2" onclick="openCheckIn(${idx})"><i class="bi bi-box-arrow-in-right"></i> ย้ายเข้า</button>`
                : `<div class="d-flex gap-1 w-100 mt-2"><button class="btn btn-sm btn-outline-warning w-50" onclick="openEditName(${idx})" title="แก้ชื่อ"><i class="bi bi-pencil-square"></i></button><button class="btn btn-sm btn-outline-danger w-50" onclick="openCheckOut(${idx})" title="ย้ายออก"><i class="bi bi-box-arrow-left"></i></button></div>`;

             html += `
             <div class="col-6 col-md" style="min-width: 130px;">
                <div class="card room-card h-100 shadow-sm">
                  <div class="room-header ${floor.colorClass}">
                    <h4><i class="bi bi-${cardIcon} me-1" style="font-size:1.1rem;"></i>${roomNo}</h4>
                  </div>
                  <div class="card-body text-center d-flex flex-column justify-content-between p-2">
                    <div>${tNameGrid}</div>
                    ${gridAction}
                  </div>
                </div>
             </div>`;

             // ตั้งค่า UI สำหรับ Table ด้านล่าง (เรียงลำดับตาม Grid เป๊ะๆ)
             let badgeTbl = isVacant ? `<span class="badge bg-danger rounded-pill px-2" style="font-size:0.7rem;">ว่าง</span>` : `<span class="badge bg-success rounded-pill px-2" style="font-size:0.7rem;">มีคนเช่า</span>`;
             let tNameTbl = isVacant ? `<span class="text-muted fst-italic" style="font-size:0.75rem;">-</span>` : `<div class="text-truncate text-dark fw-bold" style="max-width: 100px; margin:auto;">${tenant}</div>`;
             let actionTbl = isVacant 
               ? `<button class="btn btn-outline-success btn-sm" onclick="openCheckIn(${idx})"><i class="bi bi-box-arrow-in-right"></i></button>` 
               : `<button class="btn btn-outline-warning btn-sm me-1" onclick="openEditName(${idx})"><i class="bi bi-pencil"></i></button><button class="btn btn-outline-danger btn-sm" onclick="openCheckOut(${idx})"><i class="bi bi-box-arrow-left"></i></button>`;

             tbody.innerHTML += `<tr><td class="fw-bold bg-light">${phaseKey.replace("เฟส ","")}-${roomNo}</td><td>${badgeTbl}</td><td>${tNameTbl}</td><td>${parseFloat(rent||0).toLocaleString()}</td><td class="text-nowrap">${actionTbl}</td></tr>`;
          });
          html += `</div>`;
        });
        html += `</div>`;
        gridArea.innerHTML += html;
      });
    }

    // ฟังก์ชันคลิกปุ่ม Filter
    function filterPhase(phase, btnEl) {
      document.querySelectorAll('.btn-filter').forEach(el => el.classList.remove('active'));
      btnEl.classList.add('active');
      renderData(phase);
    }

    // Modal แก้ไขชื่อ
    function openEditName(idx) {
      if(!modalEdit) modalEdit = new bootstrap.Modal(document.getElementById('editNameModal'));
      let r = rawRoomData[idx];
      document.getElementById('editPhase').value = r[0]; document.getElementById('editRoom').value = r[1];
      document.getElementById('editRoomName').innerText = `(${r[0]}-${r[1]})`;
      document.getElementById('editTenantName').value = r[2]; document.getElementById('editStatus').innerText = "";
      modalEdit.show();
    }

    async function submitEditName(e) {
      e.preventDefault(); document.getElementById('btnEditName').disabled = true; document.getElementById('editStatus').className = "mt-2 text-primary"; document.getElementById('editStatus').innerText = "กำลังบันทึก...";
      let payload = { phase: document.getElementById('editPhase').value, room: document.getElementById('editRoom').value, newTenantName: document.getElementById('editTenantName').value };
      try {
        let res = await apiCall('updateTenantName', 'POST', payload);
        if(res.success){ document.getElementById('editStatus').className="mt-2 text-success"; document.getElementById('editStatus').innerText="✅ สำเร็จ"; setTimeout(()=>{modalEdit.hide(); document.getElementById('btnEditName').disabled=false; document.getElementById('contentSection').classList.add('d-none'); document.getElementById('loadingRoomMsg').classList.remove('d-none'); initManageRooms();}, 1500); }
        else throw new Error(res.message);
      } catch(err) { document.getElementById('editStatus').className="mt-2 text-danger"; document.getElementById('editStatus').innerText="❌ "+err.message; document.getElementById('btnEditName').disabled=false; }
    }

    // (ฟังก์ชัน openCheckIn, openCheckOut, calcRefund, submitCheckIn, submitCheckOut คงเดิม)
    function openCheckIn(idx) { if(!modalCI) modalCI = new bootstrap.Modal(document.getElementById('checkInModal')); let r = rawRoomData[idx]; document.getElementById('ciPhase').value = r[0]; document.getElementById('ciRoom').value = r[1]; document.getElementById('ciRoomName').innerText = `(${r[0]}-${r[1]})`; document.getElementById('ciTenant').value = ""; document.getElementById('ciDeposit').value = "5000"; document.getElementById('ciRent').value = r[3]; document.getElementById('ciWater').value = r[4]; document.getElementById('ciElec').value = r[5]; document.getElementById('ciStatus').innerText = ""; modalCI.show(); }
    function openCheckOut(idx) { if(!modalCO) modalCO = new bootstrap.Modal(document.getElementById('checkOutModal')); let r = rawRoomData[idx]; document.getElementById('coPhase').value = r[0]; document.getElementById('coRoom').value = r[1]; document.getElementById('coRoomName').innerText = `(${r[0]}-${r[1]})`; document.getElementById('lblPrevW').innerText = r[4]||0; document.getElementById('coPrevWaterRaw').value = r[4]||0; document.getElementById('lblPrevE').innerText = r[5]||0; document.getElementById('coPrevElecRaw').value = r[5]||0; document.getElementById('coCurrWater').value = ""; document.getElementById('coCurrElec').value = ""; document.getElementById('coDeposit').value = r[7]||0; document.getElementById('coCleaning').value = 300; document.getElementById('coStatus').innerText = ""; calcRefund(); modalCO.show(); }
    function calcRefund() { let dep = parseFloat(document.getElementById('coDeposit').value)||0; let clean = parseFloat(document.getElementById('coCleaning').value)||0; let pW = parseFloat(document.getElementById('coPrevWaterRaw').value)||0; let cW = parseFloat(document.getElementById('coCurrWater').value)||pW; let pE = parseFloat(document.getElementById('coPrevElecRaw').value)||0; let cE = parseFloat(document.getElementById('coCurrElec').value)||pE; document.getElementById('coRefund').value = dep - (Math.ceil(Math.max(0, cW-pW)*25)) - (Math.ceil(Math.max(0, cE-pE)*7)) - clean; }
    
    async function submitCheckIn(e) { e.preventDefault(); document.getElementById('btnCheckIn').disabled = true; document.getElementById('ciStatus').className = "mt-2 text-primary"; document.getElementById('ciStatus').innerText = "กำลังบันทึก..."; let payload = { date: document.getElementById('ciDate').value, phase: document.getElementById('ciPhase').value, room: document.getElementById('ciRoom').value, tenant: document.getElementById('ciTenant').value, deposit: document.getElementById('ciDeposit').value, rent: document.getElementById('ciRent').value, water: document.getElementById('ciWater').value, elec: document.getElementById('ciElec').value }; try { let res = await apiCall('processCheckIn', 'POST', payload); if(res.success){ document.getElementById('ciStatus').className="mt-2 text-success"; document.getElementById('ciStatus').innerText="✅ สำเร็จ"; setTimeout(()=>{modalCI.hide(); document.getElementById('btnCheckIn').disabled=false; document.getElementById('contentSection').classList.add('d-none'); document.getElementById('loadingRoomMsg').classList.remove('d-none'); initManageRooms();}, 1500); } else throw new Error(res.message); } catch(err) { document.getElementById('ciStatus').className="mt-2 text-danger"; document.getElementById('ciStatus').innerText="❌ "+err.message; document.getElementById('btnCheckIn').disabled=false; } }
    async function submitCheckOut(e) { e.preventDefault(); document.getElementById('btnCheckOut').disabled = true; document.getElementById('coStatus').className = "mt-2 text-primary"; document.getElementById('coStatus').innerText = "ประมวลผล..."; let payload = { date: document.getElementById('coDate').value, phase: document.getElementById('coPhase').value, room: document.getElementById('coRoom').value, water: document.getElementById('coCurrWater').value, elec: document.getElementById('coCurrElec').value, cleaning: document.getElementById('coCleaning').value, refund: document.getElementById('coRefund').value }; try { let res = await apiCall('processCheckOut', 'POST', payload); if(res.success){ document.getElementById('coStatus').className="mt-2 text-success"; document.getElementById('coStatus').innerText="✅ สำเร็จ"; setTimeout(()=>{modalCO.hide(); document.getElementById('btnCheckOut').disabled=false; document.getElementById('contentSection').classList.add('d-none'); document.getElementById('loadingRoomMsg').classList.remove('d-none'); initManageRooms();}, 2000); } else throw new Error(res.message); } catch(err) { document.getElementById('coStatus').className="mt-2 text-danger"; document.getElementById('coStatus').innerText="❌ "+err.message; document.getElementById('btnCheckOut').disabled=false; } }
    
    initManageRooms();
  </script>
</body>
</html>
