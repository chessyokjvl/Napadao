<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แดชบอร์ด - นภาดาวอพาร์ตเมนต์</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>
  <div id="layout-sidebar"></div>
  <div class="main-wrapper">
    <div class="topbar">
      <div class="d-flex align-items-center">
        <button class="btn-toggle-menu" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <h4 class="mb-0 text-dark fw-bold text-truncate" id="pageTitle"></h4>
      </div>
      <div class="text-muted d-none d-md-block"><i class="bi bi-calendar3"></i> <span id="currentDateDisplay"></span></div>
    </div>

    <div class="main-content">
      <div id="loadingDash" class="text-center my-5"><div class="spinner-border text-primary"></div><h6 class="mt-3">กำลังวิเคราะห์ข้อมูล...</h6></div>
      
      <div id="dashContent" class="d-none">
        <div class="row g-3 mb-4">
          <div class="col-xl-3 col-md-6 col-12"><div class="card kpi-card h-100 p-3 border-start border-primary border-4"><div class="d-flex justify-content-between align-items-center mb-2"><div><div class="text-muted fw-bold mb-1" style="font-size: 0.75rem;">อัตราเข้าพัก</div><h4 class="fw-bold text-dark mb-0" id="kpiOccPercent">0%</h4></div><div class="icon-box bg-blue"><i class="bi bi-house-check-fill"></i></div></div><div class="progress" style="height: 6px;"><div class="progress-bar bg-primary" id="kpiProgressBar" style="width: 0%"></div></div><div class="mt-2 text-muted" style="font-size: 0.8rem;">ผู้เช่า <strong id="kpiOccCount">0</strong> / <span id="kpiTotalRooms">0</span> ห้อง</div></div></div>
          <div class="col-xl-3 col-md-6 col-12"><div class="card kpi-card h-100 p-3 border-start border-danger border-4"><div class="d-flex justify-content-between align-items-center"><div><div class="text-muted fw-bold mb-1" style="font-size: 0.75rem;">ห้องว่างพร้อมเช่า</div><h4 class="fw-bold text-danger mb-0" id="kpiVacantCount">0 ห้อง</h4></div><div class="icon-box bg-red"><i class="bi bi-door-open-fill"></i></div></div><div class="mt-3" id="vacantChipsArea"></div></div></div>
          <div class="col-xl-3 col-md-6 col-12"><div class="card kpi-card h-100 p-3 border-start border-success border-4"><div class="d-flex justify-content-between align-items-center"><div><div class="text-muted fw-bold mb-1" style="font-size: 0.75rem;">รายรับรวม (<span id="lblRevMonth">-</span>)</div><h4 class="fw-bold text-success mb-0" id="kpiRevTotal">฿0</h4></div><div class="icon-box bg-green"><i class="bi bi-cash-coin"></i></div></div></div></div>
          <div class="col-xl-3 col-md-6 col-12"><div class="card kpi-card h-100 p-3 border-start border-warning border-4"><div class="d-flex justify-content-between align-items-center"><div><div class="text-muted fw-bold mb-1" style="font-size: 0.75rem;">ค่าซ่อมบำรุง (<span id="lblMaintMonth">-</span>)</div><h4 class="fw-bold text-warning mb-0" id="kpiMaintTotal">฿0</h4></div><div class="icon-box bg-orange"><i class="bi bi-tools"></i></div></div></div></div>
        </div>
        <div class="chart-box"><h6 class="fw-bold text-secondary mb-3"><i class="bi bi-bar-chart-fill"></i> รายรับ และ ซ่อมบำรุง</h6><div id="mainChartDiv" style="width: 100%; min-height: 300px;"></div></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    renderLayout('menu-dash', 'Dashboard ภาพรวม');
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(fetchDashData);

    async function fetchDashData() {
      try {
        let res = await apiCall('getDashboardData');
        if(!res.success) { document.getElementById('loadingDash').innerHTML = `<div class="alert alert-danger">❌ ${res.message}</div>`; return; }
        document.getElementById('loadingDash').classList.add('d-none'); document.getElementById('dashContent').classList.remove('d-none');
        
        let kpi = res.kpi;
        document.getElementById('kpiOccPercent').innerText = kpi.occPercent + '%'; document.getElementById('kpiProgressBar').style.width = kpi.occPercent + '%';
        document.getElementById('kpiOccCount').innerText = kpi.occupied; document.getElementById('kpiTotalRooms').innerText = kpi.total;
        document.getElementById('kpiVacantCount').innerText = kpi.vacant + ' ห้อง';
        document.getElementById('vacantChipsArea').innerHTML = kpi.vacantList.length > 0 ? kpi.vacantList.map(r => `<span class="vacant-chip">${r}</span>`).join('') : '<span class="text-success small"><i class="bi bi-check-circle-fill"></i> เต็มทุกห้อง</span>';
        document.getElementById('lblRevMonth').innerText = kpi.currMonth || '-'; document.getElementById('lblMaintMonth').innerText = kpi.currMonth || '-';
        document.getElementById('kpiRevTotal').innerText = '฿' + kpi.currRev.toLocaleString(); document.getElementById('kpiMaintTotal').innerText = '฿' + kpi.currMaint.toLocaleString();

        if(res.chart.length > 0) {
          var data = new google.visualization.DataTable();
          data.addColumn('string', 'เดือน'); data.addColumn('number', 'รายได้'); data.addColumn('number', 'ซ่อมบำรุง');
          data.addRows(res.chart.map(r => [r[0], r[4], r[5]])); 
          var options = { seriesType: 'bars', series: { 1: {type: 'line', color: '#e74a3b', lineWidth: 2, pointSize: 4} }, colors: ['#1cc88a'], legend: { position: 'bottom' }, chartArea: { width: '80%', height: '70%' }, animation:{ startup: true, duration: 1000, easing: 'out' }};
          var chart = new google.visualization.ComboChart(document.getElementById('mainChartDiv')); chart.draw(data, options);
        }
      } catch(e) { document.getElementById('loadingDash').innerHTML = `<div class="alert alert-danger">❌ เครือข่ายขัดข้อง</div>`; }
    }
    window.addEventListener('resize', () => { if(!document.getElementById('dashContent').classList.contains('d-none')) fetchDashData(); });
  </script>
</body>
</html>
