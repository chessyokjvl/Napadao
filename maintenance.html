<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แจ้งซ่อมบำรุง - นภาดาวอพาร์ตเมนต์</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="layout-sidebar"></div>
  <div class="main-wrapper">
    <div class="topbar"><div class="d-flex align-items-center"><button class="btn-toggle-menu" onclick="toggleSidebar()"><i class="bi bi-list"></i></button><h4 class="mb-0 text-dark fw-bold" id="pageTitle"></h4></div></div>
    <div class="main-content">
      <div class="container-fluid bg-white p-3 p-md-4 rounded shadow-sm">
        <div class="card bg-light border-0 mb-4 p-3 shadow-sm">
          <form id="mtForm" onsubmit="saveMt(event)">
            <div class="row g-2">
              <div class="col-md-3 col-6"><label class="fw-bold small">วันที่ซ่อม</label><input type="date" class="form-control form-control-sm" id="mtDate" required></div>
              <div class="col-md-3 col-6"><label class="fw-bold small">พื้นที่ / เฟส</label><select class="form-select form-select-sm" id="mtPhase" onchange="toggleRoom()" required><option value="ส่วนกลาง">ส่วนกลาง</option><option value="เฟส 1">เฟส 1</option><option value="เฟส 2">เฟส 2</option></select></div>
              <div class="col-md-2 col-12"><label class="fw-bold small">หมายเลขห้อง</label><input type="text" class="form-control form-control-sm" id="mtRoom" value="-" readonly placeholder="เช่น A1"></div>
              <div class="col-md-4 col-12"><label class="fw-bold small">รายการซ่อม</label><input type="text" class="form-control form-control-sm" id="mtDesc" required placeholder="เช่น เปลี่ยนหลอดไฟ"></div>
              <div class="col-md-3 col-4"><label class="fw-bold small">ค่าแรง (฿)</label><input type="number" class="form-control form-control-sm" id="mtLabor" value="0" min="0" oninput="calcTotal()"></div>
              <div class="col-md-3 col-4"><label class="fw-bold small">ค่าวัสดุ (฿)</label><input type="number" class="form-control form-control-sm" id="mtMaterial" value="0" min="0" oninput="calcTotal()"></div>
              <div class="col-md-3 col-4"><label class="fw-bold text-danger small">รวมเงิน (฿)</label><input type="number" class="form-control form-control-sm fw-bold text-danger" id="mtTotal" value="0" readonly></div>
              <div class="col-md-3 col-12 d-flex align-items-end"><button type="submit" class="btn btn-secondary btn-sm w-100 fw-bold mt-2" id="btnSaveMt">บันทึกรายการ</button></div>
            </div>
            <div id="mtStatusMsg" class="mt-2 text-center fw-bold small"></div>
          </form>
        </div>

        <h6 class="fw-bold text-secondary"><i class="bi bi-clock-history"></i> ประวัติการซ่อมบำรุง</h6>
        <div id="loadingMtMsg" class="text-center text-secondary my-3"><div class="spinner-border spinner-border-sm"></div></div>
        <div class="table-responsive" style="font-size: 0.85rem;">
          <table class="table table-bordered table-hover text-center align-middle d-none" id="mtTable"><thead class="table-secondary"><tr><th>วันที่</th><th>พื้นที่</th><th>รายการ</th><th>ค่าแรง</th><th>วัสดุ</th><th class="text-danger">รวมเงิน</th></tr></thead><tbody id="mtTableBody"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    renderLayout('menu-maint', 'แจ้งซ่อมบำรุง');
    document.getElementById('mtDate').valueAsDate = new Date();

    function toggleRoom() { let phase = document.getElementById('mtPhase').value; let r = document.getElementById('mtRoom'); if(phase==="ส่วนกลาง"){r.value="-"; r.readOnly=true;} else {r.value=""; r.readOnly=false; r.focus();} }
    function calcTotal() { document.getElementById('mtTotal').value = (parseFloat(document.getElementById('mtLabor').value)||0) + (parseFloat(document.getElementById('mtMaterial').value)||0); }

    async function loadMtHistory() {
      try {
        let data = await apiCall('getMaintenanceHistory');
        let tbody = document.getElementById('mtTableBody'); tbody.innerHTML = '';
        data.slice().reverse().forEach(row => {
          let area = row[1] === "ส่วนกลาง" ? "ส่วนกลาง" : `${row[1]} ห้อง ${row[2]}`;
          tbody.innerHTML += `<tr><td>${row[0]}</td><td class="fw-bold text-nowrap">${area}</td><td class="text-start">${row[3]}</td><td>${(parseFloat(row[4])||0).toLocaleString()}</td><td>${(parseFloat(row[5])||0).toLocaleString()}</td><td class="text-danger fw-bold">${(parseFloat(row[6])||0).toLocaleString()}</td></tr>`;
        });
        document.getElementById('loadingMtMsg').classList.add('d-none'); document.getElementById('mtTable').classList.remove('d-none');
      } catch(err) { document.getElementById('loadingMtMsg').innerHTML = `<div class="text-danger small">❌ Error: ${err.message}</div>`; }
    }

    async function saveMt(e) {
      e.preventDefault(); document.getElementById('btnSaveMt').disabled = true; document.getElementById('mtStatusMsg').className = "mt-2 text-primary"; document.getElementById('mtStatusMsg').innerText = "บันทึก...";
      let payload = { date: document.getElementById('mtDate').value, phase: document.getElementById('mtPhase').value, room: document.getElementById('mtRoom').value, desc: document.getElementById('mtDesc').value, labor: document.getElementById('mtLabor').value, material: document.getElementById('mtMaterial').value };
      try {
        let res = await apiCall('saveMaintenanceRecord', 'POST', payload);
        if(res.success){ document.getElementById('mtStatusMsg').className="mt-2 text-success"; document.getElementById('mtStatusMsg').innerText="✅ สำเร็จ"; document.getElementById('mtDesc').value=""; document.getElementById('mtLabor').value="0"; document.getElementById('mtMaterial').value="0"; calcTotal(); loadMtHistory(); }
        else throw new Error(res.message);
      } catch(err) { document.getElementById('mtStatusMsg').className="mt-2 text-danger"; document.getElementById('mtStatusMsg').innerText="❌ "+err.message; }
      finally { document.getElementById('btnSaveMt').disabled = false; setTimeout(()=>document.getElementById('mtStatusMsg').innerText="", 3000); }
    }
    loadMtHistory();
  </script>
</body>
</html>
